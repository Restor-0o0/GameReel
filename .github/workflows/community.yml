name: Community catalog

on:
  pull_request:
    paths: ["community/**", "tools/validate_community.py"]
  push:
    branches: [main]
    paths: ["community/**", "tools/validate_community.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_community.py --check
