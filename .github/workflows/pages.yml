name: Web app and privacy policy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:webApp:wasmJsBrowserDistribution -PplayRelease=true --no-daemon
      - name: Assemble site
        run: |
          mkdir -p public
          cp -r app/webApp/build/dist/wasmJs/productionExecutable/. public/
          cp -r site/. public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
